<body class="bg-slate-950 text-slate-100 antialiased min-h-screen transition-colors duration-200">

    <div id="glow2" class="absolute top-1/2 -right-40 w-96 h-96 rounded-full blur-3xl opacity-15 bg-violet-600"></div>
  </div>

        <div class="flex items-center justify-between h-14 sm:h-16 gap-2 sm:gap-3">
          
          <!-- Logo -->
          <div class="flex items-center gap-2 sm:gap-3 shrink-0 cursor-pointer select-none" onclick="switchTab('focus')">
            <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/20 text-white shrink-0">
              <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>
            </div>
            <span class="text-lg sm:text-xl font-bold tracking-tight text-white" id="brand-title">Tempo</span>
          </div>

          <!-- Navigation Tabs (Desktop / Tablet) -->
          <nav class="hidden md:flex items-center gap-1.5 p-1 rounded-xl bg-slate-900/60 border border-slate-800/60 text-xs font-medium" id="nav-container">
            <!-- Nav buttons inserted via JS -->
          </nav>

          <!-- Top Controls -->
          <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
            <!-- Language Toggle -->
            <button id="btn-lang" onclick="toggleLanguage()" class="px-2 sm:px-2.5 py-1.5 rounded-lg border border-slate-800 bg-slate-900/60 text-slate-300 hover:text-white hover:border-slate-700 text-[11px] sm:text-xs font-mono font-bold transition-all" title="Dili Değiştir / Switch Language">
              TR · EN
            </button>

            <!-- Sound Toggle -->
            <button id="btn-sound" onclick="toggleSound()" class="p-1.5 sm:p-2 rounded-lg border border-slate-800 bg-slate-900/50 text-slate-300 hover:text-white transition-colors" title="Ses Aç/Kapat">
              <svg id="icon-sound" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
            </button>

            <button id="btn-theme" onclick="toggleTheme()" class="p-1.5 sm:p-2 rounded-lg border border-slate-800 bg-slate-900/50 text-amber-400 hover:text-amber-300 transition-colors" title="Karanlık/Aydınlık Tema">

            </button>

            </button>

    </header>

      aria-label="Yeni Ekle"

    >

    ></nav>

      <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
        <span id="footer-tagline">Tempo · Modern Yapılacaklar ve Alışkanlık Takip Sistemi (Tek Dosya HTML - En Güncel Sürüm)</span>
        <div class="flex flex-wrap items-center justify-center gap-4 text-xs">
          <button onclick="openInstallModal()" class="hover:text-indigo-400 transition-colors text-emerald-400" id="footer-install-link">Nasıl Yüklenir?</button>
          <span>·</span>
          <button onclick="openDailyReportModal()" class="hover:text-indigo-400 transition-colors" id="footer-report-link">Günlük Özet Raporu</button>
          <span>·</span>
          <button onclick="switchTab('analytics')" class="hover:text-indigo-400 transition-colors" id="footer-analytics-link">Haftalık Analiz</button>
          <span>·</span>
          <button onclick="toggleLanguage()" class="hover:text-indigo-400 transition-colors font-mono font-semibold" id="footer-lang-link">English (EN)</button>
        </div>
      </div>
    </footer>

    // Web Audio Sound Engine
    class SoundEngine {
      constructor() { this.ctx = null; }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      playCheck() {
        if (!soundEnabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.22);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(); osc.stop(this.ctx.currentTime + 0.23);
        } catch(e){}
      }
    }

    // Confetti FX
    function triggerConfetti(x, y) {
      const count = 30;
      const colors = ['#6366f1', '#10b981', '#f59e0b', '#ec4899', '#06b6d4', '#8b5cf6'];
      const c = document.createElement('div');
      c.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:9999;';
      document.body.appendChild(c);
      const startX = x || window.innerWidth / 2;
      const startY = y || window.innerHeight / 2;
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        const color = colors[Math.floor(Math.random() * colors.length)];
        const size = Math.random() * 8 + 4;
        p.style.cssText = `position:absolute;left:${startX}px;top:${startY}px;width:${size}px;height:${size}px;background:${color};border-radius:50%;opacity:1;transform:translate(-50%,-50%);transition:transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease-out;`;
        c.appendChild(p);
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * 120 + 40;
        const destX = Math.cos(angle) * dist;
        const destY = Math.sin(angle) * dist - 40;
        requestAnimationFrame(() => {
          p.style.transform = `translate(calc(-50% + ${destX}px), calc(-50% + ${destY}px)) scale(0.6)`;

        });
      }
      setTimeout(() => { if (c.parentNode) c.parentNode.removeChild(c); }, 900);

    function getPastDays(n) {
      const days = [];
      const today = getTodayStr();
      const rawNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      for (let i = n - 1; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const dateStr = d.toISOString().split('T')[0];
        const rawDay = rawNames[d.getDay()];
        days.push({
          dateStr,
          rawDay,
          dayName: formatDay(rawDay),
          dayFull: formatDay(rawDay, true),
          dayNumber: d.getDate(),
          isToday: dateStr === today

      }
      return days;
    }

    // Streak Calculator
    function calculateStreak(history) {
      if (!history) return 0;
      let streak = 0;
      let d = new Date();
      const todayStr = getTodayStr();
      if (!history[todayStr]) {
        d.setDate(d.getDate() - 1);
      }
      for (let i = 0; i < 90; i++) {
        const s = d.toISOString().split('T')[0];
        if (history[s]) {
          streak++;
          d.setDate(d.getDate() - 1);
        } else {
          break;
        }
      }
      return streak;
    }

        let count = 0;
        const completedTasksList = [];

        tasks.forEach(t => {
          if (t.type === 'task' && t.completed && (!t.deadline || t.deadline === d.dateStr || d.isToday)) {
            count++;
            completedTasksList.push(t.title);
          }
          if (t.type === 'habit' && t.habitHistory && t.habitHistory[d.dateStr]) {
            count++;
            completedHabitsList.push(t.title);
          }

        totalCompleted += count;
        return { ...d, count, completedTasksList, completedHabitsList };

      const maxCount = Math.max(...activity.map(a => a.count), 4);
      const allHabits = tasks.filter(t => t.type === 'habit');
      const maxStreak = allHabits.length > 0 ? Math.max(...allHabits.map(h => calculateStreak(h.habitHistory)), 0) : 0;
      
      const totalStandard = tasks.filter(t => t.type === 'task').length;

    // --- DEEP AI COACHING ALGORITHM (Synthesizes REAL user tasks & habits) ---

          habit: h,

              </ul>
            </div>
          ` : `

              <h4 class="font-bold text-sm text-indigo-400">🧭 Smart Starter & Momentum Guide</h4>
              <p>You have no tasks or habits yet. Jumpstart your workflow with these 3 tactical steps:</p>
              <ul class="list-disc list-inside space-y-1.5 pl-1">
                <li>🎯 <strong>Identify 'The One Thing':</strong> Add one needle-moving high-priority task using "+ New Item".</li>
                <li>⚡ <strong>Establish One Keystone Habit:</strong> Anchor a 15-minute daily routine (e.g., 20m reading).</li>
                <li>⏱️ <strong>Timebox It:</strong> Assign a 30-45 minute estimated duration to eliminate initiation resistance.</li>
              </ul>
            </div>
          `;
          renderAnalytics(document.getElementById('main-content'));
          return;

        // Build Comprehensive Heuristic Report

        const hours = Math.floor(totalPendingMinutes / 60);

      tasks.unshift({

    function toggleTaskCompletion(id, e) {
      const today = getTodayStr();
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      sound.playCheck();
      if (task.type === 'habit') {
        if (!task.habitHistory) task.habitHistory = {};
        const wasDone = !!task.habitHistory[today];
        if (!wasDone) triggerConfetti(e ? e.clientX : undefined, e ? e.clientY : undefined);
        if (wasDone) delete task.habitHistory[today];
        else task.habitHistory[today] = true;
      } else {
        if (!task.completed) triggerConfetti(e ? e.clientX : undefined, e ? e.clientY : undefined);
        task.completed = !task.completed;
      }
      saveState();
      renderTasksList();
    }

    function toggleHabitDate(id, dateStr, e) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      sound.playCheck();
      if (!task.habitHistory) task.habitHistory = {};
      if (!task.habitHistory[dateStr]) triggerConfetti(e ? e.clientX : undefined, e ? e.clientY : undefined);
      if (task.habitHistory[dateStr]) delete task.habitHistory[dateStr];
      else task.habitHistory[dateStr] = true;
      saveState();
      if (activeTab === 'habits') renderHabitMatrix(document.getElementById('main-content'));
      else renderTasksList();
    }

    function toggleSubtask(taskId, subId) {
      const task = tasks.find(t => t.id === taskId);
      if (!task || !task.subtasks) return;
      const sub = task.subtasks.find(s => s.id === subId);
      if (sub) sub.completed = !sub.completed;
      saveState();
      renderTasksList();
    }

    function duplicateTask(id) {
      const tsk = tasks.find(x => x.id === id);
      if (!tsk) return;
      const copySuffix = currentLang === 'tr' ? '(Kopya)' : '(Copy)';
      tasks.unshift({ ...tsk, id: 'task-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4), title: tsk.title + ' ' + copySuffix, completed: false, habitHistory: {} });
      saveState();
      renderTasksList();
    }

    function deleteTask(id) {
      tasks = tasks.filter(x => x.id !== id);
      saveState();
      renderTasksList();
    }

    function logAllDueToday() {
      const today = getTodayStr();
      tasks.filter(t => t.type === 'habit').forEach(h => {
        if (!h.habitHistory) h.habitHistory = {};
        h.habitHistory[today] = true;
      });
      sound.playCheck();
      triggerConfetti();
      saveState();
      renderHabitMatrix(document.getElementById('main-content'));
    }

                <span class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 font-semibold">${isTr ? 'İnternetsiz Çalışır' : 'Works Offline'}</span>
              </div>
              <p class="text-xs text-slate-300">
                ${isTr 
                  ? 'Sunucu veya node.js kurulumu gerektirmez. Dosyayı bilgisayarınıza indirip istediğiniz zaman çift tıklayarak internetsiz bile kullanabilirsiniz. Tüm görevleriniz tarayıcınızda güvenle saklanır.' 
                  : 'Zero build steps or server required. Double-click the file to open it in any browser even without an active internet connection.'
                }
              </p>
            </div>

            <!-- Vercel Deployment -->
            <div class="p-4 rounded-2xl border border-emerald-500/30 bg-emerald-950/20 space-y-2">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider">
                  ${isTr ? '3. Vercel\'da Ücretsiz Yayınlama (Deploy)' : '3. Free Deploy on Vercel'}
                </span>
                <span class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 font-semibold">${isTr ? 'Hazır' : 'Ready'}</span>
              </div>
              <p class="text-xs text-slate-300">
                ${isTr 
                  ? 'Projede Vercel için <code>vercel.json</code> ve Vite yapılandırması hazırdır. GitHub deponuza yükleyip Vercel paneline bağlayarak dünya çapında ücretsiz yayına alabilirsiniz.' 
                  : 'Configured with vercel.json and Vite. Push to GitHub and connect to Vercel to publish worldwide for free.'
                }
              </p>
            </div>

            <div class="flex justify-end pt-2 border-t border-slate-800">
              <button onclick="closeModal('install-modal-container')" class="px-4 py-2 rounded-xl text-xs font-semibold bg-indigo-600 text-white">${t('close')}</button>
            </div>
          </div>
        </div>
      `;
    }

    function closeModal(id) {
      const el = document.getElementById(id);
      if (el) el.innerHTML = '';
    }

    // Toggle Settings
    function toggleLanguage() {
      currentLang = currentLang === 'tr' ? 'en' : 'tr';
      saveState();
      renderNav();
      renderMain();
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      saveState();
      const btn = document.getElementById('btn-sound');
      if (btn) btn.classList.toggle('text-slate-500', !soundEnabled);
    }

    function updateThemeUI() {
      const btn = document.getElementById('btn-theme');
      const isDark = currentTheme === 'dark';
      if (btn) {
        btn.title = isDark ? (currentLang === 'tr' ? 'Aydınlık Temaya Geç' : 'Switch to Light') : (currentLang === 'tr' ? 'Karanlık Temaya Geç' : 'Switch to Dark');
        btn.innerHTML = isDark 
          ? `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>`
          : `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>`;
      }
    }

    function applyTheme() {
      if (currentTheme === 'dark') {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
      } else {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
      }
      updateThemeUI();
    }

    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      applyTheme();
      saveState();
      renderNav();
      renderMain();
    }

    // Initialize App
    applyTheme();
    renderNav();
    renderMain();
  </script>
</body>
</html>
