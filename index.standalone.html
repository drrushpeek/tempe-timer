    // Web Audio Sound Engine
    class SoundEngine {
      constructor() { this.ctx = null; }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      playCheck() {
        if (!soundEnabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.22);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(); osc.stop(this.ctx.currentTime + 0.23);
        } catch(e){}
      }
    }
    const sound = new SoundEngine();

    // Micro Confetti Particles
    function triggerConfetti(x, y) {
      const count = 30;
      const colors = ['#6366f1', '#10b981', '#f59e0b', '#ec4899', '#06b6d4', '#8b5cf6'];
      const c = document.createElement('div');
      c.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:9999;';
      document.body.appendChild(c);
      const startX = x || window.innerWidth / 2;
      const startY = y || window.innerHeight / 2;
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        const color = colors[Math.floor(Math.random() * colors.length)];
        const size = Math.random() * 8 + 4;
        p.style.cssText = `position:absolute;left:${startX}px;top:${startY}px;width:${size}px;height:${size}px;background:${color};border-radius:50%;opacity:1;transform:translate(-50%,-50%);transition:transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease-out;`;
        c.appendChild(p);
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * 120 + 40;
        const destX = Math.cos(angle) * dist;
        const destY = Math.sin(angle) * dist - 40;
        requestAnimationFrame(() => {
          p.style.transform = `translate(calc(-50% + ${destX}px), calc(-50% + ${destY}px)) scale(0.6)`;
          p.style.opacity = '0';
        });
      }
      setTimeout(() => { if (c.parentNode) c.parentNode.removeChild(c); }, 900);
    }

    function getTodayStr() { return new Date().toISOString().split('T')[0]; }

    function getPastDays(n) {
      const days = [];
      const today = getTodayStr();
      const names = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      for (let i = n - 1; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const dateStr = d.toISOString().split('T')[0];
        days.push({
          dateStr,
          dayName: names[d.getDay()],
          dayNumber: d.getDate(),
          isToday: dateStr === today
        });
      }
      return days;
    }

      localStorage.setItem('tempo_sound_enabled', String(soundEnabled));

    // Streak Calculator
    function calculateStreak(history) {
      let streak = 0;
      let d = new Date();
      const todayStr = getTodayStr();
      if (!history[todayStr]) {
        d.setDate(d.getDate() - 1);
      }
      for (let i = 0; i < 60; i++) {
        const s = d.toISOString().split('T')[0];
        if (history[s]) {
          streak++;
          d.setDate(d.getDate() - 1);
        } else {
          break;
        }
      }
      return streak;
    }

        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="text-lg font-bold text-white">${t('dailySummaryReports')}</h2>
            <button onclick="openDailyReportModal()" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-indigo-600 text-white">✨ ${t('generateNewSummary')}</button>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${summaries.map(s => `
              <div class="p-5 rounded-2xl border border-slate-800 bg-slate-900/60 space-y-3">
                <div class="flex items-center justify-between">
                  <span class="text-xs text-indigo-400 font-bold">${s.date}</span>
                  <span class="text-2xl font-bold font-mono text-white">${s.score}%</span>
                </div>
                <p class="text-xs text-slate-300">${s.insight}</p>
                <div class="text-[11px] italic text-slate-500">${s.quote}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // --- ACTIONS ---
    function handleQuickAdd(e) {
      e.preventDefault();
      const input = document.getElementById('quick-input');
      const val = (input ? input.value : '').trim();
      if (!val) return;
      const isHabit = val.toLowerCase().includes('habit') || val.toLowerCase().includes('alışkanlık') || val.toLowerCase().includes('günlük');
      tasks.unshift({
        id: 't-' + Date.now(),
        title: val,
        type: isHabit ? 'habit' : 'task',
        category: categories[0]?.name || 'Work',
        priority: 'medium',
        estimatedMinutes: 30,
        deadline: getTodayStr(),
        recurrence: isHabit ? 'daily' : 'none',
        habitHistory: {},
        completed: false,
        subtasks: []
      });
      saveState();
      input.value = '';
      renderTasksList();
    }

    function toggleTaskCompletion(id, e) {
      const today = getTodayStr();
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      sound.playCheck();
      if (task.type === 'habit') {
        const wasDone = !!task.habitHistory[today];
        if (!wasDone) triggerConfetti(e ? e.clientX : undefined, e ? e.clientY : undefined);
        if (wasDone) delete task.habitHistory[today];
        else task.habitHistory[today] = true;
      } else {
        if (!task.completed) triggerConfetti(e ? e.clientX : undefined, e ? e.clientY : undefined);
        task.completed = !task.completed;
      }
      saveState();
      renderTasksList();
    }

    function toggleHabitDate(id, dateStr, e) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      sound.playCheck();
      if (!task.habitHistory[dateStr]) triggerConfetti(e ? e.clientX : undefined, e ? e.clientY : undefined);
      if (task.habitHistory[dateStr]) delete task.habitHistory[dateStr];
      else task.habitHistory[dateStr] = true;
      saveState();
      if (activeTab === 'habits') renderHabitMatrix(document.getElementById('main-content'));
      else renderTasksList();
    }

    function toggleSubtask(taskId, subId) {
      const task = tasks.find(t => t.id === taskId);
      if (!task || !task.subtasks) return;
      const sub = task.subtasks.find(s => s.id === subId);
      if (sub) sub.completed = !sub.completed;
      saveState();
      renderTasksList();
    }

    function duplicateTask(id) {
      const t = tasks.find(x => x.id === id);
      if (!t) return;
      tasks.unshift({ ...t, id: 't-' + Date.now(), title: t.title + ' (Kopya)', completed: false, habitHistory: {} });
      saveState();
      renderTasksList();
    }

    function deleteTask(id) {
      tasks = tasks.filter(x => x.id !== id);
      saveState();
      renderTasksList();
    }

    function logAllDueToday() {
      const today = getTodayStr();
      tasks.filter(t => t.type === 'habit').forEach(h => {
        h.habitHistory[today] = true;
      });
      sound.playCheck();
      triggerConfetti();
      saveState();
      renderHabitMatrix(document.getElementById('main-content'));
    }

    function generateAiCoach() {
      customAiReport = currentLang === 'tr'
        ? "Yapay Zeka Değerlendirmesi: Son 7 günde görevleri tamamlama ivmeniz %86 seviyesinde. Yüksek öncelikli işlerinizi sabah 08:30 - 10:00 bloğuna koyarak haftayı en yüksek odakla tamamlayabilirsiniz."
        : "AI Executive Synthesis: Execution velocity stands at 86% across 7 days. Anchoring high-priority needle-movers to your 08:30 morning block preserves cognitive flow.";
      renderAnalytics(document.getElementById('main-content'));
    }

    // Modal Handlers
    function openDailyReportModal() {
      const today = getTodayStr();
      const doneTasks = tasks.filter(t => t.type === 'task' && t.completed).length;
      const totalTasks = tasks.filter(t => t.type === 'task').length || 1;
      const doneHabits = tasks.filter(t => t.type === 'habit' && t.habitHistory[today]).length;
      const totalHabits = tasks.filter(t => t.type === 'habit').length || 1;
      const score = Math.round(((doneTasks / totalTasks) * 0.6 + (doneHabits / totalHabits) * 0.4) * 100);

      const insight = currentLang === 'tr'
        ? "Bugün kritik odaklarınızı başarıyla korudunuz. İvmenizi yarın sabahki ilk görev bloğuna taşıyın!"
        : "Exceptional discipline demonstrated across core objectives today. Carry momentum forward!";

      const quote = currentLang === 'tr'
        ? '"Mükemmellik bir eylem değil, bir alışkanlıktır." — Aristoteles'
        : '"Success is the product of daily habits—not once-in-a-lifetime transformations." — James Clear';

      const container = document.getElementById('summary-modal-container');
      container.innerHTML = `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-md">
          <div class="relative w-full max-w-lg rounded-3xl border border-slate-700 bg-slate-900/95 p-6 shadow-2xl text-slate-100 space-y-4">
            <div class="flex items-center justify-between pb-3 border-b border-slate-800">
              <h2 class="text-lg font-bold">${t('dailySummaryTitle')}</h2>
              <button onclick="closeModal('summary-modal-container')" class="text-slate-400 hover:text-white">✕</button>
            </div>
            <div class="p-4 rounded-2xl bg-indigo-600/10 border border-indigo-500/20 flex items-center justify-between">
              <div>
                <span class="text-xs text-indigo-400 font-semibold uppercase">${t('productivityScore')}</span>
                <div class="text-3xl font-extrabold font-mono text-white">${score}%</div>
              </div>
              <div class="text-right text-xs font-mono text-slate-300">
                <div>${t('tasksLabel')}: ${doneTasks}/${totalTasks}</div>
                <div>${t('habitsLabel')}: ${doneHabits}/${totalHabits}</div>
              </div>
            </div>
            <div class="p-3 rounded-xl border border-slate-800 bg-slate-950/40 text-xs text-slate-300 leading-relaxed">
              <span class="font-bold text-indigo-400">✨ ${t('aiInsightTitle')}:</span> ${insight}
            </div>
            <div class="text-xs italic text-slate-400">${quote}</div>
            <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
              <button onclick="closeModal('summary-modal-container')" class="px-4 py-2 rounded-xl text-xs border border-slate-700">${t('close')}</button>
              <button onclick="saveSummaryRecord('${today}', ${score}, '${insight.replace(/'/g, "\\'")}', '${quote.replace(/'/g, "\\'")}')" class="px-4 py-2 rounded-xl text-xs font-semibold bg-indigo-600 text-white">${t('saveToHistory')}</button>
            </div>
          </div>
        </div>
      `;
    }

    function saveSummaryRecord(date, score, insight, quote) {
      summaries.unshift({ date, score, insight, quote });
      saveState();
      closeModal('summary-modal-container');
      if (activeTab === 'summaries') renderSummaries(document.getElementById('main-content'));
    }

    function openTaskModal(defaultType) {
      const container = document.getElementById('task-modal-container');
      container.innerHTML = `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-md">
          <div class="relative w-full max-w-lg rounded-3xl border border-slate-700 bg-slate-900/95 p-6 shadow-2xl text-slate-100 space-y-4">
            <div class="flex items-center justify-between pb-3 border-b border-slate-800">
              <h2 class="text-lg font-bold">${t('createTitle')}</h2>
              <button onclick="closeModal('task-modal-container')" class="text-slate-400 hover:text-white">✕</button>
            </div>
            <form onsubmit="handleCreateTask(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">${t('titleLabel')}</label>
                <input id="modal-title" type="text" required placeholder="${currentLang === 'tr' ? 'Örn: Sabah 20 dk Koşu veya Kod İnceleme' : 'e.g., Morning 20m Run'}" class="w-full px-3.5 py-2 rounded-xl text-xs bg-slate-950/60 border border-slate-800 text-slate-100 focus:outline-none focus:ring-1 focus:ring-indigo-500" />
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-400 mb-1">${t('categoryLabel')}</label>
                  <select id="modal-category" class="w-full px-3 py-1.5 rounded-xl text-xs bg-slate-950 border border-slate-800 text-slate-200">
                    ${categories.map(c => `<option value="${c.name}">${c.name}</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-400 mb-1">${t('priorityLabel')}</label>
                  <select id="modal-priority" class="w-full px-3 py-1.5 rounded-xl text-xs bg-slate-950 border border-slate-800 text-slate-200">
                    <option value="high">${t('highPriority')}</option>
                    <option value="medium" selected>${t('mediumPriority')}</option>
                    <option value="low">${t('lowPriority')}</option>
                  </select>
                </div>
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-400 mb-1">${t('recurrenceLabel')}</label>
                  <select id="modal-recurrence" class="w-full px-3 py-1.5 rounded-xl text-xs bg-slate-950 border border-slate-800 text-slate-200">
                    <option value="none">${t('none')}</option>
                    <option value="daily">${t('daily')}</option>
                    <option value="weekdays">${t('weekdays')}</option>
                    <option value="weekends">${t('weekends')}</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-400 mb-1">${t('estimatedTimeLabel')}</label>
                  <input id="modal-minutes" type="number" value="30" class="w-full px-3 py-1.5 rounded-xl text-xs bg-slate-950 border border-slate-800 text-slate-200" />
                </div>
              </div>
              <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
                <button type="button" onclick="closeModal('task-modal-container')" class="px-4 py-2 rounded-xl text-xs border border-slate-700">${t('cancelBtn')}</button>
                <button type="submit" class="px-4 py-2 rounded-xl text-xs font-semibold bg-indigo-600 text-white">${t('createItemBtn')}</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function handleCreateTask(e) {
      e.preventDefault();
      const title = document.getElementById('modal-title').value.trim();
      const category = document.getElementById('modal-category').value;
      const priority = document.getElementById('modal-priority').value;
      const recurrence = document.getElementById('modal-recurrence').value;
      const estimatedMinutes = Number(document.getElementById('modal-minutes').value) || 30;

      tasks.unshift({
        id: 't-' + Date.now(),
        title,
        type: recurrence !== 'none' ? 'habit' : 'task',
        category,
        priority,
        estimatedMinutes,
        deadline: getTodayStr(),
        recurrence,
        habitHistory: {},
        completed: false,
        subtasks: []
      });

      saveState();
      closeModal('task-modal-container');
      renderMain();
    }

    function closeModal(id) {
      const el = document.getElementById(id);
      if (el) el.innerHTML = '';
    }

    // Toggle Settings
    function toggleLanguage() {
      currentLang = currentLang === 'tr' ? 'en' : 'tr';
      saveState();
      renderNav();
      renderMain();
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      saveState();
      const btn = document.getElementById('btn-sound');
      btn.classList.toggle('text-slate-500', !soundEnabled);
    }

    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.classList.toggle('dark', currentTheme === 'dark');
      saveState();
    }

    // Init App
    renderNav();
    renderMain();
  </script>
</body>
</html>
